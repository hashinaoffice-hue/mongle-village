<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>몽글 마을</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed 3D field, hand-drawn ink-bordered paper chips floating at the corners */
:root{
  --ink:#4b3a35;
  --paper:#fffaf1;
  --pink:#f3a5b6;
  --pink-deep:#e2788f;
  --leaf:#8cc06f;
  --sky:#cfeaf8;
  --butter:#ffd86b;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
.chip{background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;box-shadow:0 3px 0 var(--ink)}
.btn{cursor:pointer;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);padding:.45em 1em;font-family:var(--display);font-size:16px;transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.card:focus-visible{outline:3px dashed var(--pink-deep);outline-offset:3px}

/* ---------- select screen ---------- */
#select{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,rgba(207,234,248,.25),rgba(255,250,241,.45) 75%);overflow-y:auto;z-index:20}
#select h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(46px,9vw,84px);line-height:1;letter-spacing:.02em;
  color:var(--paper);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);text-wrap:balance;text-align:center}
#select p.lead{margin:0;font-size:17px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:.35em 1.1em}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,190px));gap:16px;width:100%;justify-content:center}
.card{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px 14px;background:var(--paper);
  border:2.5px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--ink);transition:transform .15s, box-shadow .15s;min-width:0}
.card:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 9px 0 var(--ink)}
.card img{width:100%;max-width:150px;aspect-ratio:1;border-radius:18px;background:radial-gradient(circle at 50% 60%,#eaf6dc 0 55%,#d7eec4 56%)}
.card .nm{font-family:var(--display);font-size:26px;line-height:1}
.card .ds{font-size:14px;opacity:.8;text-align:center}
.stat{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:13px;width:100%;max-width:150px;align-items:center}
.dots{display:flex;gap:3px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);background:transparent}
.dots i.on{background:var(--butter)}
.hint{font-size:14px;opacity:.85;text-align:center;background:rgba(255,250,241,.8);border-radius:999px;padding:.2em .9em}
@media (max-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,170px))}}
/* nickname step */
#pickStep{display:contents}
#nickForm{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(480px,100%)}
#nickForm .hint{word-break:keep-all}
#nickMsg:empty{display:none}
#nickForm label{font-family:var(--display);font-size:20px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:.3em 1.1em}
.nickrow{display:flex;gap:8px;width:100%}
#nickIn{flex:1;min-width:0;font:inherit;font-family:var(--display);font-size:20px;text-align:center;padding:.5em 1em;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--ink);outline:none}
#nickIn:focus{border-color:var(--pink-deep)}
#nickIn::placeholder{color:var(--ink);opacity:.4}
#nickForm .btn{font-size:19px;background:var(--butter)}
.nickme{display:inline-flex;align-items:center;gap:8px;font-size:16px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:.25em .4em .25em 1em}
.nickme b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--pink-deep)}
.nickme .btn{font-size:14px;padding:.2em .8em;box-shadow:0 2px 0 var(--ink)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#who{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px}
#who img{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:#eaf6dc}
#who .nm{font-family:var(--display);font-size:20px;line-height:1}
#who .cnt{font-size:14px;font-variant-numeric:tabular-nums}
#who .cnt b{font-family:var(--display);font-weight:400;font-size:17px}
#bar{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:25;flex-wrap:wrap;justify-content:flex-end}
.btn.snd{display:inline-flex;align-items:center;gap:6px;padding:.4em .85em}
.btn.snd svg{width:17px;height:17px}
.btn.snd[aria-pressed="false"]{background:#e9e2d6;opacity:.7;text-decoration:line-through}
@media (max-width:520px){#bar .btn{font-size:14px}#bar .btn.snd{font-size:0;gap:0;padding:.5em}.btn.snd svg{width:19px;height:19px}}
#help{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-start;gap:8px}
#helpBody{padding:10px 14px;font-size:13.5px;line-height:1.7;max-width:270px}
#bHelp{pointer-events:auto;width:40px;height:40px;padding:0;font-size:22px;line-height:1}
#bHelp[aria-expanded="true"]{background:var(--butter)}
#help kbd{font-family:var(--display);font-size:13px;border:1.5px solid var(--ink);border-bottom-width:3px;border-radius:6px;padding:0 5px;background:#fff}
#toast{position:absolute;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--display);font-size:20px;padding:.4em 1.1em;white-space:nowrap;opacity:0;transition:opacity .3s, transform .3s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:9}
.bubble{position:absolute;transform:translate(-50%,-100%);background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:.3em .8em;font-size:15px;width:max-content;max-width:min(260px,70vw);text-align:center;word-break:keep-all;overflow-wrap:anywhere;opacity:0;transition:opacity .25s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:12px;height:12px;background:var(--paper);border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.bubble b{font-family:var(--display);font-weight:400;margin-right:.35em;color:var(--pink-deep)}
.bubble.show{opacity:1}

/* channels & multiplayer */
.chwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:rgba(255,250,241,.88);border:2.5px solid var(--ink);border-radius:22px;padding:8px 12px;max-width:100%}
.chlabel{font-family:var(--display);font-size:18px}
.channels{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ch{cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:50px;padding:4px 6px;border:2px solid var(--ink);border-radius:12px;background:#fff;font-variant-numeric:tabular-nums}
.ch .n{font-family:var(--display);font-size:17px;line-height:1.1}
.ch .c{font-size:11.5px;opacity:.75}
.ch{position:relative}
.ch .ph{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);background:#ffd86b}
.ch .ph[data-phase="새벽"]{background:linear-gradient(#b9a6e6,#f6b3c2)}
.ch .ph[data-phase="아침"]{background:#ffe08a}
.ch .ph[data-phase="노을"]{background:linear-gradient(#ffb36a,#f0708a)}
.ch .ph[data-phase="밤"]{background:#2a3560}
.ch[aria-pressed="true"]{background:var(--butter);box-shadow:0 3px 0 var(--ink)}
.ch:disabled{opacity:.45;cursor:not-allowed}
.status{min-height:1.4em;margin:0;font-size:15px;color:var(--pink-deep);font-family:var(--display);text-align:center}
.nametag{position:absolute;transform:translate(-50%,-100%);background:rgba(255,250,241,.92);border:2px solid var(--ink);border-radius:999px;padding:.05em .7em;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.nametag.show{opacity:1}
#who .nick{font-size:13px;color:var(--pink-deep);font-family:var(--display)}
/* time-of-day chip */
.clock{display:inline-flex;align-items:center;gap:7px;padding:.38em .95em .38em .7em;border-radius:999px;font-family:var(--display);font-size:15px}
.clock #clockT{font-variant-numeric:tabular-nums;opacity:.7;font-size:14px}
.clock i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#ffd86b}
.clock[data-phase="새벽"] i{background:linear-gradient(#b9a6e6,#f6b3c2)}
.clock[data-phase="아침"] i{background:#ffe08a}
.clock[data-phase="노을"] i{background:linear-gradient(#ffb36a,#f0708a)}
.clock[data-phase="밤"] i{background:#f3f0dc;box-shadow:inset -4px -1px 0 #2a3560}
@media (max-width:520px){.clock{font-size:13px}.clock #clockT{display:none}}

/* doors */
#prompt{position:absolute;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:.45em 1.1em;font-family:var(--display);font-size:18px;color:var(--ink);cursor:pointer;pointer-events:auto;animation:promptBob 1.6s ease-in-out infinite}
#prompt kbd{font-family:var(--display);font-size:15px;border:1.5px solid var(--ink);border-bottom-width:3px;border-radius:6px;padding:0 6px;background:var(--butter)}
.touch #prompt kbd{display:none}
@keyframes promptBob{50%{transform:translateX(-50%) translateY(-4px)}}
#iris{position:fixed;inset:0;z-index:15;pointer-events:none;--r:120;background:radial-gradient(circle at 50% 55%,transparent calc(var(--r) * 1vmax),#2a1c14 calc(var(--r) * 1vmax + 2px))}
@media (prefers-reduced-motion:reduce){#prompt{animation:none}}

/* graphics picker (PC only) */
.seg{display:inline-flex;align-items:center;gap:2px;padding:3px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);font-family:var(--display);font-size:14px}
.seg span{padding:0 .45em 0 .65em}
.seg button{cursor:pointer;border:0;background:transparent;border-radius:999px;padding:.3em .8em;font-family:var(--display);font-size:14px;color:var(--ink)}
.seg button:hover{background:#f3ead9}
.seg button[aria-pressed="true"]{background:var(--butter)}
.seg button:focus-visible{outline:3px dashed var(--pink-deep);outline-offset:1px}
.touch #gfx{display:none}

/* map */
#map{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(72px + env(safe-area-inset-top,0px));padding:6px 8px 8px;width:min(236px,46vw);pointer-events:none}
.maphead{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-family:var(--display);font-size:15px;padding:0 2px 4px}
.maphead span{font-family:var(--body);font-size:12px;opacity:.85}
.maphead b{font-family:var(--display);font-weight:400;font-size:14px;color:#c98a00}
#mapC{display:block;width:100%;border-radius:12px;border:2px solid var(--ink);background:#e3f2c4}
@media (max-width:520px){.maphead{font-size:13px}.maphead span{font-size:11px}}
/* chat */
#chatlog{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(108px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:min(340px,70vw);pointer-events:none}
#chatlog .ln{background:rgba(255,250,241,.88);border:2px solid var(--ink);border-radius:12px;padding:.15em .65em;font-size:13.5px;line-height:1.45;overflow-wrap:anywhere;transition:opacity .8s}
#chatlog .ln b{font-family:var(--display);font-weight:400;color:var(--pink-deep);margin-right:.4em}
#chatlog .ln.me b{color:#4f6c9c}
#chatlog .ln.sys{font-family:var(--display);font-size:12.5px;opacity:.85;border-style:dashed}
#chatlog .ln.old{opacity:0}
#chatbar{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;width:min(520px,calc(100vw - 32px));pointer-events:auto}
#chatIn{flex:1;min-width:0;font:inherit;font-size:16px;padding:.55em 1em;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--ink);outline:none}
#chatIn:focus{border-color:var(--pink-deep)}
.chatting #touch,.chatting #help{display:none!important}
#tbtns{flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 180px)}
#emotes{display:flex;gap:6px;flex-basis:100%;justify-content:flex-end;flex-wrap:wrap}
#tbtns #emotes .btn{width:auto;height:auto;border-radius:999px;font-size:13px;padding:.35em .75em}

/* touch controls */
#touch{display:none}
.touch #touch{display:block}
.touch #help{display:none}
#joy{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;
  background:rgba(255,250,241,.55);border:2.5px solid var(--ink);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--pink);border:2.5px solid var(--ink)}
#tbtns{position:absolute;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
#tbtns .btn{width:70px;height:70px;padding:0;border-radius:50%;font-size:17px;touch-action:none}
#bJump{background:var(--butter)!important;width:84px!important;height:84px!important}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:24px;background:var(--sky);z-index:30}
@media (prefers-reduced-motion:reduce){.card,.btn,#toast{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="몽글 마을 3D 맵"></canvas>
<div id="bubbles"></div>

<div id="hud" hidden>
  <div id="who" class="chip"><img id="whoImg" alt=""><div><div class="nm" id="whoName">몽실</div><div class="nick" id="whoNick"></div><div class="cnt">별사탕 <b id="cnt">0</b> / <span id="tot">12</span> · <span id="chInfo"></span></div></div></div>
  <div id="help">
    <div id="helpBody" class="chip">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 · <kbd>Shift</kbd> 달리기<br>
    <kbd>Space</kbd> 점프 · <kbd>E</kbd> 인사하기<br>
    <kbd>1</kbd>~<kbd>4</kbd> 한마디 보내기 · <kbd>Enter</kbd> 채팅<br>
    문 앞에서 <kbd>F</kbd> 들어가기 · <kbd>M</kbd> 지도<br>
    마우스 드래그로 시점 회전, 휠로 확대<br>
    푸딩 산 쿠키 계단 꼭대기에 금별사탕이 있어요<br>
    북쪽 이정표를 따라가면 숲이 나와요
    </div>
    <button class="btn" id="bHelp" type="button" aria-expanded="true" aria-controls="helpBody" title="도움말 접기/펼치기" aria-label="도움말">?</button>
  </div>
  <div id="map" class="chip" hidden><div class="maphead">몽글 지도 <span>남은 별사탕 <b id="mapLeft">0</b></span></div><canvas id="mapC" aria-label="몽글 마을 지도"></canvas></div>
  <div id="toast" class="chip"></div>
  <div id="chatlog" aria-live="polite"></div>
  <button id="prompt" class="chip" type="button" hidden><kbd>F</kbd><span id="promptTxt"></span></button>
  <form id="chatbar" hidden autocomplete="off">
    <input id="chatIn" maxlength="60" placeholder="할 말을 입력하고 Enter (Esc 취소)" enterkeyhint="send" aria-label="채팅 입력">
    <button class="btn" type="submit">보내기</button>
  </form>
  <div id="touch">
    <div id="joy"><div id="knob"></div></div>
    <div id="tbtns"><div id="emotes"><button class="btn" id="bChat" type="button">채팅</button><button class="btn" data-k="1">반가워</button><button class="btn" data-k="2">같이 가자</button><button class="btn" data-k="3">고마워</button></div><button class="btn" id="bWave">인사</button><button class="btn" id="bJump">점프</button></div>
  </div>
</div>

<div id="select" hidden>
  <h1>몽글 마을</h1>
  <form id="nickForm" autocomplete="off">
    <label for="nickIn">마을에서 불릴 이름을 정해 주세요</label>
    <div class="nickrow">
      <input id="nickIn" maxlength="12" placeholder="닉네임 (12자까지)" enterkeyhint="go" spellcheck="false">
      <button class="btn" type="submit">좋아요</button>
    </div>
    <p class="status" id="nickMsg" role="status"></p>
    <div class="hint">비워 두면 랜덤 이름이 정해져요 · 이번 접속에서만 쓰고 저장하지 않아요</div>
  </form>
  <div id="pickStep" hidden>
  <div class="nickme">닉네임 <b id="nickShow"></b><button class="btn" type="button" id="bNick">바꾸기</button></div>
  <div class="chwrap"><span class="chlabel">채널</span><div class="channels" id="channels"></div></div>
  <p class="lead">함께 산책할 친구를 골라 주세요</p>
  <div class="cards" id="cards"></div>
  <p class="status" id="status" role="status"></p>
  <div class="hint" id="starHint">들판 곳곳에 숨은 별사탕 12개를 모아 보세요</div>
  </div>
</div>
<div id="bar">
  <div id="clock" class="chip clock" title="지금 시간에 맞춰 하늘이 바뀌어요 (채널마다 1시간씩 늦어요)"><i aria-hidden="true"></i><span id="clockPh">낮</span><span id="clockT"></span></div>
  <button class="btn" id="bSwap" hidden>친구 바꾸기</button>
  <button class="btn snd" id="bMap" hidden aria-pressed="true" aria-controls="map" title="지도 펴기/접기 (M)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5l5-2 5 2 5-2v12l-5 2-5-2-5 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7.5 3v12M12.5 5v12" stroke="currentColor" stroke-width="1.6"/></svg>지도</button>
  <div id="gfx" class="seg" role="group" aria-label="그래픽 설정"><span>화질</span><button type="button" data-l="2">낮음</button><button type="button" data-l="1">중간</button><button type="button" data-l="0">높음</button></div>
  <button class="btn snd" id="bMusic" aria-pressed="true" title="배경음악 켜기/끄기"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 15.5V4.5l9-2v10.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="5" cy="15.5" r="2.4" fill="currentColor"/><circle cx="14" cy="13" r="2.4" fill="currentColor"/></svg>음악</button>
  <button class="btn snd" id="bSfx" aria-pressed="true" title="효과음·목소리 켜기/끄기"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13 7.5a3.5 3.5 0 0 1 0 5M15.5 5a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>효과음</button>
</div>
<div id="iris" hidden></div>
<div id="loading">마을을 짓는 중…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const _bw = new V3();
function tickButterflies(dt, T, night) {
  const show = 1 - smooth(0.35, 0.7, night);
  for (const b of butterflies) {
    const far = !player || player.zone === 'tower' ? true : b.pos.distanceToSquared(player.pos) > 8100;   // the lodge window still shows them
    b.b.visible = show > 0.01 && !(far && player);
    if (!b.b.visible) continue;
    b.b.scale.setScalar(b.size * show);
    const ground = terrain(b.pos.x, b.pos.z);
    if (b.rest > 0) {                       // resting: wings slowly open and close
      b.rest -= dt; b.alt += (0.06 - b.alt) * Math.min(1, dt * 3);
      const f = 0.55 + 0.45 * Math.sin(T * 2.2 + b.ph); b.wl.rotation.z = f; b.wr.rotation.z = -f;
    } else {
      if ((b.retarget -= dt) <= 0 || b.pos.distanceTo(b.tgt) < 0.8) {
        b.retarget = rand(2.5, 6);
        if (Math.random() < 0.22) { b.rest = rand(2, 5); b.vel.set(0, 0, 0); }
        else { const a = rand(0, 6.28), r = rand(1, 7); b.tgt.set(b.home.x + Math.cos(a) * r, 0, b.home.z + Math.sin(a) * r); }
      }
      _bw.set(b.tgt.x - b.pos.x, 0, b.tgt.z - b.pos.z); const l = _bw.length() || 1; _bw.multiplyScalar(1.5 / l);
      _bw.x += Math.sin(T * 3.1 + b.ph) * 0.9; _bw.z += Math.cos(T * 2.6 + b.ph * 1.7) * 0.9;
      b.vel.lerp(_bw, Math.min(1, dt * 2.5)); b.pos.addScaledVector(b.vel, dt);
      b.alt += (1.0 + 0.55 * Math.sin(T * 1.3 + b.ph) - b.alt) * Math.min(1, dt * 2);
      const f = Math.sin(T * 17 + b.ph) * 0.95; b.wl.rotation.z = 0.15 + f; b.wr.rotation.z = -0.15 - f;
      if (b.vel.lengthSq() > 1e-4) b.b.rotation.y = Math.atan2(b.vel.x, b.vel.z);
    }
    b.b.position.set(b.pos.x, ground + b.alt + (b.rest > 0 ? 0 : Math.abs(Math.sin(T * 8.5 + b.ph)) * 0.18), b.pos.z);   // 폴폴: a hop with each wingbeat
  }
}

function addResident(make, name, voice, lines, pos, scale = 1, hop = false, faceYaw = null) {
  const m = make(); m.g.position.copy(pos); m.g.scale.setScalar(scale);
  m.g.rotation.y = faceYaw != null ? faceYaw : Math.atan2(INT.x - pos.x, INT.z - pos.z); scene.add(m.g);
  const el = document.createElement('div'); el.className = 'bubble'; $('bubbles').appendChild(el);
  const r = { ...m, name, voice, lines, pos: pos.clone(), say: 0, el, bubbleH: m.h * scale + 0.8, cool: rand(0, 2), t: rand(0, 6), baseYaw: m.g.rotation.y, hop, hopT: rand(0.5, 2), vy: 0, oy: 0 };
  residents.push(r); return r;
}
function residentTalk(r, text) {
  r.say = 3.6; r.el.innerHTML = '<b>' + esc(r.name) + '</b>' + esc(text);
  const [k, p] = ear(r.pos); Snd.speak(r.voice, text, Math.max(k, 0.3), p);
}
function tickResidents(dt) {
  for (const r of residents) {
    if (r.pos.distanceToSquared(player.pos) > 4900) { r.el.classList.remove('show'); continue; } // only animals near you move and talk
    r.t += dt;
    const b = Math.sin(r.t * 2.4); r.body.scale.set(1 - b * 0.015, 1 + b * 0.035, 1 - b * 0.015);
    const dx = player.pos.x - r.pos.x, dz = player.pos.z - r.pos.z, near = Math.hypot(dx, dz) < 5 && Math.abs(player.pos.y - r.pos.y) < 3;
    let d = (near ? Math.atan2(dx, dz) : r.baseYaw) - r.g.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
    r.g.rotation.y += d * Math.min(1, dt * 4);
    if (r.hop) { if ((r.hopT -= dt) <= 0) { r.hopT = rand(0.6, 2.4); r.vy = 3.2; } r.vy -= 14 * dt; r.oy = Math.max(0, r.oy + r.vy * dt); r.g.position.y = r.pos.y + r.oy; }
    if ((r.cool -= dt) <= 0 && near) { residentTalk(r, pick(r.lines)); r.cool = rand(6, 10); }
    if (r.update) r.update(r, dt, near);
    placeBubble(r, dt);
  }
}

const PHRASES = ['안녕~!', '반가워!', '같이 가자~', '고마워!'];

function connect(ch, charId, nick) {
  return new Promise((resolve, reject) => {
    let ws, settled = false;
    try { ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'); }
    catch (e) { return reject('noserver'); }
    ws.onopen = () => ws.send(JSON.stringify({ t: 'join', ch, char: charId, nick }));
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (!settled) {
        if (m.t === 'welcome') { settled = true; Object.assign(Net, { ws, id: m.id, nick: m.nick, ch: m.ch, max: m.max }); skyCh = m.ch; m.players.forEach(addRemote); resolve(m); }
        else if (m.t === 'full') { settled = true; reject('full'); }
        else if (m.t === 'taken') { settled = true; reject('taken'); }
        return;
      }
      onNet(m);
    };
    ws.onclose = () => {
      if (!settled) { settled = true; reject('noserver'); return; }
      if (Net.ws !== ws) return;                       // we left on purpose
      Net.ws = null; clearRemotes();
      if (mode === 'play') { backToSelect(); setStatus('서버와 연결이 끊어졌어요. 다시 골라 주세요.'); }
    };

}
function leaveServer() { const w = Net.ws; Net.ws = null; if (w) w.close(); clearRemotes(); }

  const c = new Critter(d, 6, 22);
  c.nick = p.nick;
  const tag = document.createElement('div'); tag.className = 'nametag'; tag.textContent = p.nick; $('bubbles').appendChild(tag);
  const r = { c, tag, tgt: c.pos.clone(), yaw: 0, sp: 0, g: true };

  Net.remotes.set(p.id, r);
}
function applyState(r, s, snap) {

  const g = !!s[5];

  if (!snap && !r.g && g) r.c.squash = 0.5;

  else if (m.t === 'leave') { const r = Net.remotes.get(m.id); if (r) { toast(r.c.nick + '님이 돌아갔어요'); addLog(null, r.c.nick + '님이 돌아갔어요'); } removeRemote(m.id); updateCount(); }
  else if (m.t === 'c') { const r = Net.remotes.get(m.id); if (r && typeof m.text === 'string') { sayChat(r.c, m.text); addLog(r.c.nick, m.text); } }

  for (const b of balloons) { b.b.position.y = b.y0 + Math.sin(T * 0.8 + b.ph) * 0.5; b.b.rotation.z = Math.sin(T * 0.6 + b.ph) * 0.08; }
  for (const s of swayers) { s.o.rotation.z = Math.sin(T * 0.9 + s.ph) * s.amp; s.o.rotation.x = Math.sin(T * 0.7 + s.ph * 1.3) * s.amp * 0.6; }
  pudding.jig *= Math.exp(-dt * 2.2);
  { const w = Math.sin(T * 13) * pudding.jig * 0.035 + Math.sin(T * 1.3) * 0.003; pudding.body.scale.set(1 - w * 0.5, 1 + w, 1 - w * 0.5); }
  tickButterflies(dt, T, skyU.night.value);
  {
    const c = player ? player.pos : camTarget, P = motes.p;
    motes.base.forEach((m, i) => {
      P[i * 3] = c.x + m.x + Math.sin(T * 0.4 + m.ph) * 0.8;
      P[i * 3 + 1] = c.y + ((m.y + T * 0.22) % 7) + 0.2;
      P[i * 3 + 2] = c.z + m.z + Math.cos(T * 0.35 + m.ph) * 0.8;
    });
    motes.g.attributes.position.needsUpdate = true;
  }
  clouds.rotation.y = T * 0.004;
  // forest mood: greener haze, softer sky light, more birdsong
  forestAmb += ((player && player.zone === 'world' ? forestK(player.pos.x, player.pos.z) : 0) - forestAmb) * Math.min(1, dt * 1.5);
  const S = updateSky(dt, T);
  scene.fog.color.copy(S.fog).lerp(FOG_F, forestAmb * (1 - S.night) * 0.8);
  // from the treetop terrace the haze lifts and far things stay drawn, so the whole village shows
  viewBoost += ((player && player.zone === 'terrace' ? 1.9 : 1) - viewBoost) * Math.min(1, dt * 2);
  scene.fog.near = LEVELS[level].fogN * viewBoost * S.fogMul; scene.fog.far = LEVELS[level].fogF * viewBoost * (0.6 + 0.4 * S.fogMul);
  if (player) tickResidents(dt);
  tickWanderers(dt, T, skyU.night.value);
  for (const l of lanterns) l.s.material.opacity = 0.7 + 0.15 * Math.sin(T * 3 + l.ph);
  fires.forEach((f, i) => f.scale.set(1 + 0.08 * Math.sin(T * 17 + i), 1 + 0.15 * Math.sin(T * 11 + 1 + i), 1));
  tickSmoke(dt);
  tickFalls(dt, S);
  // indoors the light turns warm and soft, like lamplight inside a tree
  indoorAmb += ((player && player.zone === 'tower' ? 1 : player && player.zone === 'cabin' ? 0.35 : 0) - indoorAmb) * Math.min(1, dt * 3);
  const outHemi = S.hi - 0.1 * forestAmb * (1 - S.night);
  hemi.intensity = outHemi + (0.48 - outHemi) * indoorAmb;
  hemi.color.copy(S.hs).lerp(WARM_SKY, indoorAmb); hemi.groundColor.copy(S.hg).lerp(WARM_GND, indoorAmb);
  sun.intensity = S.li + (0.37 - S.li) * indoorAmb; sun.color.copy(S.lc).lerp(WARM_SUN, indoorAmb);
  Snd.setForest(forestAmb * (1 - S.night));
  for (const s of forestBits.shafts) s.m.opacity = s.base * (0.7 + 0.3 * Math.sin(T * 0.5 + s.ph)) * S.shaft;
  TEX.water.offset.set(T * 0.012, T * 0.007);
  tickBlooms(dt);
  tickParts(dt);

  // sun follows the player; snap to shadow texels so shadows don't shimmer
  const focus = player ? player.pos : camTarget.set(0, 0, 0);
  const tx = (2 * SH) / shadowSize, fx = Math.round(focus.x / tx) * tx, fz = Math.round(focus.z / tx) * tx;
  sun.position.set(fx + lightDir.x * 66, focus.y + lightDir.y * 66, fz + lightDir.z * 66); sun.target.position.set(fx, focus.y, fz);
  cull(focus);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------------- performance: distance culling and automatic quality ---------------- */
// each level trades detail for speed; phones start one step down and any device steps down if frames drop
// 0 높음, 1 중간, 2 낮음 can be picked on PC; 3 is a last resort the frame-rate watcher may fall back to
const LEVELS = [
  { name: '높음', pr: Math.min(window.devicePixelRatio, 2), shadow: 4096, draw: 300, outline: 110, grass: 110, fogN: 150, fogF: 470, fx: true },
  { name: '중간', pr: Math.min(window.devicePixelRatio, 1.5), shadow: 2048, draw: 170, outline: 75, grass: 85, fogN: 85, fogF: 265, fx: true },
  { name: '낮음', pr: 1, shadow: 1024, draw: 115, outline: 45, grass: 55, fogN: 55, fogF: 150, fx: true },
  { name: '최저', pr: 0.8, shadow: 512, draw: 85, outline: 26, grass: 36, fogN: 40, fogF: 108, fx: false },
];
let gfxManual = false, level = IS_TOUCH ? 2 : 0;
if (!IS_TOUCH) try { const s = localStorage.getItem('mongle-gfx'); if (s !== null && +s >= 0 && +s <= 2) { level = +s; gfxManual = true; } } catch (e) {}
let shadowSize = QUALITY.shadow;
const cullables = [];
{
  const skip = new Set([sun.target, clouds]);
  critters.forEach(c => { skip.add(c.obj); skip.add(c.blobShadow); });
  stars.forEach(s => skip.add(s.m));
  butterflies.forEach(b => skip.add(b.b));
  scene.updateMatrixWorld(true);
  const box = new THREE.Box3(), sph = new THREE.Sphere();
  for (const o of scene.children) {
    if (skip.has(o) || o.isLight || o.isInstancedMesh || o.isPoints || o.userData.keep) continue;
    box.setFromObject(o); if (box.isEmpty()) continue; box.getBoundingSphere(sph);
    if (sph.radius > 60) continue;
    const outlines = []; o.traverse(c => { if (c.userData.outline) outlines.push(c); });
    cullables.push({ o, c: sph.center.clone(), r: sph.radius, outlines, vis: true, ol: true });
  }
}
const _frus = new THREE.Frustum(), _pm = new THREE.Matrix4();
function cull(f) {
  const L = LEVELS[level], draw = L.draw * viewBoost;
  for (const k of cullables) {
    const d = Math.hypot(k.c.x - f.x, k.c.z - f.z) - k.r;
    const vis = d < draw; if (vis !== k.vis) { k.o.visible = vis; k.vis = vis; }
    const ol = d < L.outline; if (vis && ol !== k.ol) { for (const m of k.outlines) m.visible = ol; k.ol = ol; }
  }
  camera.updateMatrixWorld(); _pm.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); _frus.setFromProjectionMatrix(_pm);
  for (const g of grassChunks) { const s = g.userData.chunk; g.visible = Math.hypot(s.center.x - f.x, s.center.z - f.z) - s.radius < L.grass && _frus.intersectsSphere(s); }
}
function applyLevel() {
  const L = LEVELS[level];
  renderer.setPixelRatio(L.pr); renderer.setSize(innerWidth, innerHeight);
  if (shadowSize !== L.shadow) { shadowSize = L.shadow; sun.shadow.mapSize.set(L.shadow, L.shadow); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }
  scene.fog.near = L.fogN; scene.fog.far = L.fogF;
  for (const s of forestBits.shafts) s.m.visible = L.fx;
  motes.pts.visible = L.fx;
  document.querySelectorAll('#gfx button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.l === Math.min(level, 2)));
}
// PC graphics picker: a manual choice is remembered and stops the automatic step-down
document.querySelectorAll('#gfx button').forEach(b => b.addEventListener('click', () => {
  level = +b.dataset.l; gfxManual = true; perf.bad = 0; perf.warm = 3;
  try { localStorage.setItem('mongle-gfx', String(level)); } catch (e) {}
  applyLevel(); Snd.pop(); canvas.focus();
}));
// measure real frame rate in 2.5 s windows; two slow windows in a row drop one quality level
const perf = { t: 0, frames: 0, warm: 4, bad: 0 };
function watchFps(raw) {
  if (document.hidden || raw > 0.5) return;
  if ((perf.warm -= raw) > 0) return;
  perf.t += raw; perf.frames++;
  if (perf.t < 2.5) return;
  const fps = perf.frames / perf.t; perf.t = 0; perf.frames = 0;
  if (fps < 38 && !gfxManual && level < LEVELS.length - 1) {
    if (++perf.bad >= 2) {
      level++; applyLevel(); perf.bad = 0; perf.warm = 3;
      if (mode === 'play') toast('부드럽게 움직이도록 화질을 조금 낮췄어요', 2600);
    }
  } else perf.bad = 0;
}
applyLevel();

makeThumbs();
buildSelect();
renderChannels();
refreshChannels();
$('loading').hidden = true;
$('select').hidden = false;
